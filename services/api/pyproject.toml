[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sched-api"
version = "0.1.0"
description = "FastAPI for the PLH auto-scheduling platform (/api/v1/sched)"
requires-python = ">=3.12"
dependencies = ["auto-scheduling", "fastapi>=0.115", "uvicorn>=0.32", "pydantic-settings>=2.6", "openpyxl>=3.1", "python-multipart>=0.0.18"]

[tool.setuptools.packages.find]
where = ["src"]
