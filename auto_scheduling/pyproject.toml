[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-scheduling"
version = "0.2.0"
description = "PLH weekly auto-scheduling engine + ETL (SPEC v0.3)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "tzdata>=2024.1",
    "pyodbc>=5.2",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.6",
]

[project.scripts]
sched-engine = "auto_scheduling.cli:main"

[tool.setuptools.packages.find]
include = ["auto_scheduling*"]
